name: Deploy Akash Birthday Surprise

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir dist
          cp index.html styles.css script.js dist/
          if [ -f favicon.svg ]; then cp favicon.svg dist/; fi
          if compgen -G '*.jpg' > /dev/null; then cp *.jpg dist/; fi
          if compgen -G '*.jpeg' > /dev/null; then cp *.jpeg dist/; fi
          if compgen -G '*.png' > /dev/null; then cp *.png dist/; fi
          if [ -d images ]; then cp -r images dist/; fi
          if [ -d audio ]; then cp -r audio dist/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
