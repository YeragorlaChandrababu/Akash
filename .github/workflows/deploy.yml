name: Deploy Akash Birthday Surprise

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair CSS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/styles.css")
          css = path.read_text()
          broken = "background:linear-gradient(transparent 55%,rgba(9,7,12,.72)}"
          fixed = "background:linear-gradient(transparent 55%,rgba(9,7,12,.72));}"
          if broken in css:
              path.write_text(css.replace(broken, fixed, 1))
          PY
          if ! git diff --quiet -- src/styles.css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/styles.css
            git commit -m "fix: correct memory image overlay CSS"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
